/* داده‌های نمایشی — کاملاً ساختگی. تاریخ‌ها نسبت به روز اولین اجرا ساخته و سپس ذخیره می‌شوند. */
const DEPT_NAMES=['بخش تجدیدپذیر','بخش پست توزیع','بخش پست فوق توزیع','بخش کنترل پروژه','بخش مناقصات','بخش مالی'];
const PS=['برنامه‌ریزی','در حال اجرا','در انتظار تأیید','متوقف‌شده','تکمیل‌شده','لغوشده'];
const TS=['جدید','برنامه‌ریزی‌شده','در حال انجام','در انتظار بررسی','تکمیل‌شده','لغوشده'];

const dateOffset=n=>{const t=new Date();t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)};
function seed(){
 const desc=['مطالعات امکان‌سنجی و طراحی نیروگاه‌های خورشیدی','طراحی پست‌های توزیع و شبکه میان‌ولتاژ','طراحی پست‌های فوق توزیع و خطوط انتقال','برنامه‌ریزی، پایش پیشرفت و ریسک پروژه‌ها','ارزیابی فرصت‌ها و تهیه اسناد مناقصه','پیگیری بودجه، صورت‌حساب و پرداخت‌ها'];
 const depts=DEPT_NAMES.map((n,i)=>({id:'d'+i,name:n,head:'p'+i,desc:desc[i]}));
 const nm=['آرمان کیانی','سپیده نوروزی','کامران راد','مهسا فرهمند','پویا صالحی','نگار توکلی','داریوش منصوری','الهام جعفری','بابک رضوی','شیدا پارسا','یاسر امیری (میدانی)','ترانه کاشانی (پیمانکار)'];
 const jt=['مدیر بخش','طراح ارشد','کارشناس طراحی','کارشناس برنامه‌ریزی','کارشناس مناقصه','کارشناس مالی'];
 const people=nm.map((n,i)=>({id:'p'+i,name:n,dept:'d'+(i%6),title:i<6?'مدیر بخش':jt[1+i%5],role:i<6?'مدیر واحد':i<10?'کارشناس':'پیمانکار',type:i<10?'داخلی':'پیمانکار/میدانی',email:'demo'+i+'@example.test',active:true}));
 const pt=['طراحی نیروگاه خورشیدی نمونه ۵ مگاوات','طراحی پست توزیع ناحیه صنعتی نمونه','طراحی پست ۶۳/۲۰ کیلوولت نمونه','پایش برنامه زمانی طرح‌های منطقه‌ای','ارزیابی فنی مناقصه شبکه هوشمند','بازنگری اسناد مالی طرح‌های نمونه'];
 const stt=[1,1,2,1,0,1],bud=[900,650,1200,300,200,150];
 const projects=pt.map((t,i)=>({id:'pr'+i,code:'SE-P-'+(101+i),title:t,desc:'پروژه نمایشی: '+t,dept:'d'+i,manager:'p'+i,status:PS[stt[i]],priority:PR[(i+1)%4],start:dateOffset(-90+i*5),due:dateOffset(20+i*25),budget:bud[i],spent:Math.round(bud[i]*[.55,.4,.7,.5,.2,.3][i])}));
 const tt=['مطالعه تابش و پتانسیل سایت','تهیه نقشه تک‌خطی','بازبینی محاسبات بار','هماهنگی با تیم میدانی','تهیه فهرست مصالح','بررسی نقشه‌های اجرایی','برآورد منابع و زمان','تهیه گزارش پیشرفت','کنترل مدارک مناقصه','پیگیری صورت‌حساب'];
 const st10=[2,4,2,3,4,1,0,4,2,4],off=[-12,-5,3,8,-2,15,21,-20,6,30,-8,12];
 const tasks=[];for(let i=0;i<32;i++){const a=i%12,st=i===13?5:st10[i%10],due=dateOffset(off[i%12]);
  const t={id:'t'+i,title:tt[i%10]+' ('+(i+1)+')',desc:'شرح نمایشی وظیفه.',project:'pr'+(i%6),dept:'d'+(a%6),assignee:'p'+a,creator:'p'+(i%6),priority:PR[i%4],status:TS[st],start:dateOffset(off[i%12]-14),due,est:8+(i%5)*8,dep:'',comments:[]};
  if(st===4)t.done=i%5?due:dateOffset(off[i%12]+3);tasks.push(t)}
 tasks[3].dep='t2';
 const dn=['گزارش مطالعات اولیه','نقشه تک‌خطی','ضمانت‌نامه حسن انجام کار','مشخصات فنی تجهیزات','اسناد مناقصه','گزارش مالی فصلی','صورتجلسه هماهنگی','نقشه‌های اجرایی'];
 const docs=dn.map((t,i)=>({id:'dc'+i,title:t+' — نمونه',cat:['گزارش','نقشه','ضمانت‌نامه','مشخصات','مناقصه','مالی','صورتجلسه','نقشه'][i],project:'pr'+(i%6),dept:'d'+(i%6),owner:'p'+(i%10),status:['تأییدشده','در انتظار تأیید','تأییدشده','پیش‌نویس','در انتظار تأیید','تأییدشده','پیش‌نویس','رد‌شده'][i],expiry:dateOffset([40,10,22,60,5,90,-3,30][i])}));
 const contracts=[0,1,2,3,4].map(i=>({id:'ct'+i,ref:'CT-'+(201+i),title:'قرارداد نمونه '+(i+1),project:'pr'+i,dept:'d'+i,owner:'p'+i,status:['فعال','فعال','در انتظار امضا','فعال','پایان‌یافته'][i],start:dateOffset(-120+i*10),end:dateOffset(15+i*40),renew:dateOffset(5+i*30),note:'یادداشت نمایشی'}));
 const opps=[0,1,2,3,4].map(i=>({id:'op'+i,ref:'TN-'+(301+i),title:['مطالعه خورشیدی منطقه‌ای','طراحی شبکه توزیع شهری','پست فوق توزیع نمونه','نظارت بر طرح میان‌ولتاژ','امکان‌سنجی ذخیره‌ساز'][i]+' (نمونه)',client:['شرکت نمونه آذر','سازمان نمونه جنوب','شرکت توزیع نمونه','سازمان نمونه شرق','شرکت نمونه کویر'][i],dept:'d4',owner:'p4',status:['شناسایی','آماده‌سازی اسناد','ارسال‌شده','برنده','شناسایی'][i],due:dateOffset([8,20,-5,45,12][i]),value:[400,800,1500,350,600][i],next:'پیگیری مرحله بعد'}));
 const events=[0,1,2,3,4,5].map(i=>({id:'ev'+i,title:['جلسه هماهنگی هفتگی','بازبینی طراحی','نقطه‌عطف تحویل فاز ۱','جلسه ارزیابی مناقصه','هماهنگی تیم میدانی','بررسی بودجه'][i],date:dateOffset([1,3,7,2,9,5][i]),time:['09:00','10:30','08:00','14:00','11:00','13:00'][i],type:['جلسه','بازبینی','نقطه‌عطف','جلسه','هماهنگی','جلسه'][i],project:'pr'+i,dept:'d'+i}));
 return{depts,people,projects,tasks,docs,contracts,opps,events,log:[{t:Date.now(),m:'داده‌های نمایشی بارگذاری شد'}]};
}

</script>
<script>
/* AURA WORK — معماری: state(S) + selectors + R(پیکربندی CRUD عمومی) + V(نماها) + رویدادهای واگذارشده */
const KEY='aura-work-v1',$=s=>document.querySelector(s);
const load=()=>{try{const j=JSON.parse(localStorage.getItem(KEY));const required=['depts','people','projects','tasks','docs','contracts','opps','events','log'];if(j&&j.v===1&&j.d&&required.every(k=>Array.isArray(j.d[k]))&&j.d.depts.length&&j.d.people.length&&j.d.projects.length&&j.d.tasks.length)return{...j,role:ROLES_SAFE(j.role),read:Array.isArray(j.read)?j.read:[]}}catch(e){console.warn('AURA WORK: stored demo data is invalid; resetting.',e)}return{v:1,d:seed(),role:'senior',read:[]}};
function ROLES_SAFE(r){return ['senior','manager','expert','contractor'].includes(r)?r:'senior'}
let S=load(),U={v:'dash',f:{},tv:'board',chat:[],sort:'due'};const CH=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('ذخیره‌سازی محلی ممکن نشد')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>Number(n).toLocaleString('fa-IR'),dt=d=>d?new Date(d+'T00:00').toLocaleDateString('fa-IR-u-ca-persian'):'—';
const today=()=>new Date().toISOString().slice(0,10),by=(k,id)=>S.d[k].find(x=>x.id===id),nm=(k,id,f='name')=>(by(k,id)||{})[f]||'—';
const log=m=>{S.d.log.unshift({t:Date.now(),m});S.d.log.length=Math.min(S.d.log.length,30)};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
const ROLES={senior:'مدیرعامل / مدیریت ارشد',manager:'مدیر واحد',expert:'کارشناس',contractor:'نیروی پیمانکاری'};
const me=()=>by('people',{manager:'p0',expert:'p6',contractor:'p10'}[S.role]);
/* دسترسی نمایشی (نه امنیت واقعی) */
const vt=()=>S.d.tasks.filter(t=>S.role==='senior'||(S.role==='manager'&&t.dept===me().dept)||(S.role!=='manager'&&S.role!=='senior'&&t.assignee===me().id));
const vp=()=>{const ids=new Set(vt().map(t=>t.project));return S.d.projects.filter(p=>S.role==='senior'||(S.role==='manager'?p.dept===me().dept||ids.has(p.id):ids.has(p.id)))};
const fin=t=>t.status==='تکمیل‌شده'||t.status==='لغوشده',od=t=>t.due<today()&&!fin(t);
const prog=p=>{const a=S.d.tasks.filter(t=>t.project===p.id&&t.status!=='لغوشده');return a.length?Math.round(100*a.filter(t=>t.status==='تکمیل‌شده').length/a.length):0};
const atRisk=p=>p.status==='در حال اجرا'&&(S.d.tasks.some(t=>t.project===p.id&&od(t))||(p.due<D(14)&&prog(p)<60));
function D(n){const t=new Date();t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)}
/* گزینه‌ها */
const O={dept:()=>S.d.depts.map(d=>[d.id,d.name]),per:()=>S.d.people.map(p=>[p.id,p.name]),proj:()=>S.d.projects.map(p=>[p.id,p.code+' '+p.title]),tsk:()=>[['','—'],...S.d.tasks.map(t=>[t.id,t.title])],s:a=>()=>a.map(x=>[x,x])};
const F=(n,l,t='text',o,opt)=>[n,l,t,o,opt];
const dr=[F('title','عنوان'),F('dept','بخش','select',O.dept),F('project','پروژه','select',O.proj)];
const R={
 projects:{s:'پروژه',t:'پروژه‌ها',f:[F('code','کد پروژه'),F('title','عنوان'),F('desc','توضیحات','area',0,1),F('dept','بخش','select',O.dept),F('manager','مدیر پروژه','select',O.per),F('status','وضعیت','select',O.s(PS)),F('priority','اولویت','select',O.s(PR)),F('start','شروع','date'),F('due','موعد','date'),F('budget','بودجه (میلیون ریال، نمایشی)','number'),F('spent','هزینه ثبت‌شده','number')],cols:['code','title','dept','manager','status','priority','due'],def:{},val:o=>o.due<o.start?'موعد پیش از شروع است.':''},
 tasks:{s:'وظیفه',t:'وظایف',f:[F('title','عنوان'),F('desc','شرح','area',0,1),F('project','پروژه','select',O.proj),F('dept','بخش','select',O.dept),F('assignee','مسئول','select',O.per),F('priority','اولویت','select',O.s(PR)),F('status','وضعیت','select',O.s(TS)),F('start','شروع','date'),F('due','موعد','date'),F('est','برآورد (ساعت)','number'),F('dep','پیش‌نیاز','select',O.tsk,1)],cols:['title','project','assignee','priority','status','due'],def:{creator:'p0',comments:[]},
  val:(o,id)=>{if(o.due<o.start)return'موعد پیش از شروع است.';const d=o.dep&&by('tasks',o.dep);if(d&&d.id===id)return'پیش‌نیاز نمی‌تواند خودِ وظیفه باشد.';if(d&&!fin(d)&&['در حال انجام','در انتظار بررسی','تکمیل‌شده'].includes(o.status))return'پیش‌نیاز «'+d.title+'» هنوز تکمیل نشده است.';return''}},
 people:{s:'کارمند',t:'تیم‌ها و کارکنان',f:[F('name','نام'),F('dept','بخش','select',O.dept),F('title','عنوان شغلی'),F('role','نقش','select',O.s(['مدیر واحد','کارشناس','پیمانکار'])),F('type','دسته','select',O.s(['داخلی','پیمانکار/میدانی'])),F('email','ایمیل نمونه','email')],cols:['name','dept','title','role','type'],def:{active:true},val:o=>/@example\.test$/.test(o.email)?'':'ایمیل نمونه باید به example.test ختم شود.'},
 depts:{s:'بخش',t:'ساختار سازمانی',f:[F('head','مسئول بخش','select',O.per),F('desc','توضیحات','area')],cols:[],def:{}},

 S.d.contracts.filter(c=>c.renew<=w&&c.status==='فعال').forEach(c=>n.push({id:'cx'+c.id+c.renew,t:'📑 موعد تمدید: '+esc(c.title),k:'contracts',r:c.id}));
 S.d.opps.filter(o=>o.due<=D(14)&&o.due>=t0&&!['برنده','بازنده','لغوشده'].includes(o.status)).forEach(o=>n.push({id:'ox'+o.id+o.due,t:'⏰ مهلت مناقصه: '+esc(o.title),k:'opps',r:o.id}));return n}
/* دستیار */
function answer(s){const T=vt(),ln=(k,x,l)=>`<a class="lk" data-act="edit" data-k="${k}" data-id="${x.id}">${esc(l)}</a>`;let r;
 if(/پروژه/.test(s)){const a=vp().filter(atRisk);r=a.length?`${fa(a.length)} پروژه در معرض تأخیر (دارای وظیفه عقب‌افتاده یا موعد نزدیک با پیشرفت کم):<ul>${a.map(p=>`<li>${ln('projects',p,p.title)} — پیشرفت ${fa(prog(p))}٪، ${fa(T.filter(t=>t.project===p.id&&od(t)).length)} وظیفه عقب‌افتاده</li>`).join('')}</ul>`:'در داده‌های فعلی پروژه‌ای با این معیار یافت نشد.'}
 else if(/عقب/.test(s)){const a=S.d.depts.map(d=>[d,T.filter(t=>t.dept===d.id&&od(t))]).filter(x=>x[1].length).sort((x,y)=>y[1].length-x[1].length);r=a.length?'<ul>'+a.map(([d,t])=>`<li>${esc(d.name)}: ${fa(t.length)} وظیفه — ${t.slice(0,3).map(x=>ln('tasks',x,x.title)).join('، ')}</li>`).join('')+'</ul>':'وظیفه عقب‌افتاده‌ای وجود ندارد.'}
 else if(/هفته|موعد/.test(s)){const a=T.filter(t=>!fin(t)&&t.due>=today()&&t.due<=D(7)),e=S.d.events.filter(x=>x.date>=today()&&x.date<=D(7));r=a.length+e.length?'<ul>'+a.map(t=>`<li>${ln('tasks',t,t.title)} — ${dt(t.due)}</li>`).join('')+e.map(x=>`<li>${ln('events',x,'📅 '+x.title)} — ${dt(x.date)}</li>`).join('')+'</ul>':'موعدی در ۷ روز آینده ثبت نشده است.'}
 else if(/بار/.test(s))r='<ul>'+S.d.depts.map(d=>`<li>${esc(d.name)}: ${fa(T.filter(t=>t.dept===d.id&&!fin(t)).length)} وظیفه باز</li>`).join('')+'</ul>';
 else if(/سند/.test(s)){const a=S.d.docs.filter(d=>d.expiry<=D(30)).sort((x,y)=>x.expiry.localeCompare(y.expiry));r=a.length?'<ul>'+a.map(d=>`<li>${ln('docs',d,d.title)} — ${dt(d.expiry)}</li>`).join('')+'</ul>':'سندی در ۳۰ روز آینده به موعد نمی‌رسد.'}
 else r='این دستیار فقط پنج الگوی از پیش‌تعریف‌شده (پروژه‌های پرریسک، وظایف عقب‌افتاده، موعدهای هفته، بار کاری، اسناد نزدیک به موعد) را پاسخ می‌دهد و برای سایر پرسش‌ها داده‌ای در اختیار ندارد.';
 U.chat.push({q:s,a:r+(/پروژه|عقب/.test(s)?'<br><small>پیشنهاد: وظایف عقب‌افتاده را بازتخصیص دهید یا موعد را بازبینی کنید.</small>':'')})}
/* ----- رندر ----- */
function charts(){CH.splice(0).forEach(c=>c.destroy());if(U.v!=='dash'||typeof Chart==='undefined'||!$('#c1'))return;
 const T=vt().filter(t=>!U.f.dept||t.dept===U.f.dept);CH.push(new Chart($('#c1'),{type:'bar',data:{labels:S.d.depts.map(d=>d.name.replace('بخش ','')),datasets:[{label:'باز',data:S.d.depts.map(d=>T.filter(t=>t.dept===d.id&&!fin(t)).length),backgroundColor:'#2463A6'},{label:'تکمیل‌شده',data:S.d.depts.map(d=>T.filter(t=>t.dept===d.id&&t.status==='تکمیل‌شده').length),backgroundColor:'#278C87'}]},options:{plugins:{legend:{rtl:true}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true}}}}));
 CH.push(new Chart($('#c2'),{type:'doughnut',data:{labels:TS,datasets:[{data:TS.map(s=>T.filter(t=>t.status===s).length),backgroundColor:['#9aa8b8','#2463A6','#278C87','#C98722','#27845A','#C44949']}]},options:{plugins:{legend:{rtl:true}}}}))}
const NAV=[['dash','داشبورد','smec'],['orgs','ساختار سازمانی','sm'],['people','تیم‌ها و کارکنان','sm'],['projects','پروژه‌ها','sme'],['tasks','وظایف','smec'],['events','تقویم','sme'],['kpi','عملکرد و شاخص‌ها','sm'],['docs','اسناد','sm'],['contracts','قراردادها','s'],['fin','نمای مالی','s'],['opps','مناقصات','sm'],['notes','اعلان‌ها','smec'],['ai','دستیار نمایشی','sm']];
function render(){const ok=NAV.filter(n=>n[2].includes(S.role[0]));if(!ok.some(n=>n[0]===U.v)&&U.v!=='search')U.v='dash';
 $('#nav').innerHTML=ok.map(n=>`<a class="${n[0]===U.v?'on':''}" tabindex="0" data-act="go" data-v="${n[0]}" data-fk="" data-fv="">${n[1]}</a>`).join('');
 $('#role').innerHTML=Object.entries(ROLES).map(([k,v])=>`<option value="${k}"${k===S.role?' selected':''}>${v}</option>`).join('');
 $('#bell').textContent=fa(notes().filter(n=>!S.read.includes(n.id)).length);$('#main').innerHTML=V[U.v]();charts();$('#side').classList.remove('open')}
function go(v,fk,fv){U.v=v;U.f=fk?{[fk]:fv}:{};render();scrollTo(0,0)}
function openForm(k,id){const c=R[k],it=(id&&by(k,id))||{};$('#m').innerHTML=`<form data-k="${k}" data-id="${id||''}"><h3>${id?'ویرایش':'ایجاد'} ${c.s}</h3>${c.f.map(([n,l,t,o])=>{const v=it[n]??(t==='number'?0:'');const i=t==='select'?`<select name="${n}">${o().map(([a,b])=>`<option value="${esc(a)}"${a==v?' selected':''}>${esc(b)}</option>`).join('')}</select>`:t==='area'?`<textarea name="${n}" rows="3">${esc(v)}</textarea>`:`<input name="${n}" type="${t}" value="${esc(v)}">`;return`<label>${l}${i}</label>`}).join('')}${k==='tasks'?`<label>افزودن نظر<input name="_c"></label><ul class="l">${(it.comments||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<p class="err" role="alert"></p><div class="row"><button class="btn p">ذخیره</button><button type="button" class="btn" data-act="close">انصراف</button></div></form>`;$('#m').showModal()}
function remove(k,id){const it=by(k,id);if(k==='people'&&S.d.tasks.some(t=>t.assignee===id&&!fin(t)))return toast('این فرد وظیفه باز دارد؛ ابتدا وظایف را بازتخصیص دهید.');
 if(!confirm('این رکورد حذف شود؟'+(k==='projects'?' وظایف، اسناد و رویدادهای پروژه نیز حذف می‌شوند.':'')))return;
 if(k==='projects'){['tasks','docs','events','contracts'].forEach(x=>S.d[x]=S.d[x].filter(r=>r.project!==id))}
 if(k==='people'){S.d.tasks.forEach(t=>{if(t.assignee===id)t.assignee=t.dept?by('depts',t.dept).head:'p0'});S.d.depts.forEach(d=>{if(d.head===id)d.head='p0'})}
 if(k==='tasks')S.d.tasks.forEach(t=>{if(t.dep===id)t.dep=''});
 S.d[k]=S.d[k].filter(r=>r.id!==id);log('حذف '+R[k].s+': '+(it.title||it.name));save();render();toast('حذف شد')}
function setStatus(id,s){const t=by('tasks',id),d=t.dep&&by('tasks',t.dep);if(d&&!fin(d)&&['در حال انجام','در انتظار بررسی','تکمیل‌شده'].includes(s)){toast('هشدار: پیش‌نیاز تکمیل نشده است.');return render()}
 t.status=s;t.done=s==='تکمیل‌شده'?today():undefined;log('وضعیت «'+t.title+'» → '+s);save();render()}
/* رویدادها */
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const d=a.dataset;
 ({go:()=>go(d.v,d.fk,d.fv),menu:()=>$('#side').classList.toggle('open'),close:()=>$('#m').close(),new:()=>openForm(d.k),edit:()=>{if($('#m').open)$('#m').close();openForm(d.k,d.id)},del:()=>remove(d.k,d.id),tv:()=>{U.tv=U.tv==='board'?'table':'board';render()},
 tog:()=>{const p=by('people',d.id);p.active=!p.active;log((p.active?'فعال‌سازی ':'غیرفعال‌سازی ')+p.name);save();render()},
 reset:()=>{if(confirm('همه داده‌های نمایشی به حالت اولیه بازگردانده شود؟')){S={v:1,d:seed(),role:'senior',read:[]};U={v:'dash',f:{},tv:'board',chat:[],sort:'due'};save();render();toast('داده‌ها بازنشانی شد')}},
 readall:()=>{S.read=notes().map(n=>n.id);save();render()},unr:()=>{U.unread=!U.unread;render()},
 note:()=>{if(!S.read.includes(d.id))S.read.push(d.id);save();U.v=d.k;U.f={};render();openForm(d.k,d.r)},
 ask:()=>{answer(d.q);render()},askin:()=>{const v=$('#aq').value.trim();if(v){answer(v);render()}}})[d.act]?.()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset?.act&&e.target.tagName==='A'||e.key==='Enter'&&e.target.classList.contains('kpi'))e.target.click();if(e.key==='Enter'&&e.target.id==='aq')document.querySelector('[data-act=askin]').click()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.st)return setStatus(t.dataset.st,t.value);if(t.dataset.sort!==undefined){U.sort=t.value;render()}});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;U.f[f]=t.value;render();const n=document.querySelector(`[data-f="${f}"]`);if(n&&t.type==='search'){n.focus();n.setSelectionRange(n.value.length,n.value.length)}});
$('#role').addEventListener('change',e=>{S.role=e.target.value;U.f={};save();render();toast('نقش نمایشی: '+ROLES[S.role])});
$('#gs').addEventListener('input',e=>{U.s=e.target.value.trim();U.v='search';render()});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();const k=f.dataset.k,id=f.dataset.id,c=R[k],fd=new FormData(f),o={},er=m=>{f.querySelector('.err').textContent=m};
 for(const [n,l,t,,opt] of c.f){let v=String(fd.get(n)||'').trim();if(!v&&!opt)return er('«'+l+'» الزامی است.');if(t==='number'){v=Number(v);if(isNaN(v)||v<0)return er('«'+l+'» باید عدد نامنفی باشد.')}o[n]=v}
 const m=c.val&&c.val(o,id);if(m)return er(m);let it;
 if(id){it=by(k,id);Object.assign(it,o)}else{it={id:k[0]+Date.now().toString(36),...c.def,...o};if(k==='tasks'){it.comments=[];it.creator=me()?me().id:'p0'}S.d[k].push(it)}
 if(k==='tasks'){const cm=String(fd.get('_c')||'').trim();if(cm)it.comments.push(cm);it.done=it.status==='تکمیل‌شده'?(it.done||today()):undefined}
 log((id?'ویرایش ':'ایجاد ')+c.s+': '+(it.title||it.name||it.id));save();$('#m').close();render();toast('ذخیره شد')});
render();

</script>
</body></html>
